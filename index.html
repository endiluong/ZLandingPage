<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dakonipa · Room Tour</title>
    <meta name="description" content="Dakonipa: Day Koder Nite Painter. A guided three.js tour of my room and working space." />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <canvas id="scene" aria-hidden="true"></canvas>

    <nav class="bar" aria-label="Scene controls">
      <div class="group" role="group" aria-label="Lighting" data-control="lighting">
        <button data-value="morning" data-i18n="morning">Morning</button>
        <button data-value="day" data-i18n="day">Day</button>
        <button data-value="evening" data-i18n="evening">Evening</button>
        <button data-value="night" data-i18n="night" aria-pressed="true">Night</button>
      </div>
      <div class="group" role="group" aria-label="Render style" data-control="style">
        <button data-value="full" data-i18n="full" aria-pressed="true">Full</button>
        <button data-value="clay" data-i18n="clay">Clay</button>
        <button data-value="wire" data-i18n="wire">Wireframe</button>
      </div>
      <div class="group">
        <button id="curtains" data-i18n="curtains">Curtains</button>
      </div>
      <div class="group" role="group" aria-label="Language" data-control="lang">
        <button data-value="en" aria-pressed="true">EN</button>
        <button data-value="vi">VI</button>
      </div>
    </nav>

    <!-- Each section is one stop of the camera tour (see src/tour.js). Text lives in src/i18n.js. -->
    <main>
      <section class="left">
        <div class="card">
          <p class="eyebrow" data-i18n="s0.eyebrow">Room tour</p>
          <h1>Dakonipa</h1>
          <p class="tagline">Day Koder Nite Painter</p>
          <p data-i18n="s0.body"></p>
        </div>
      </section>
      <section class="right">
        <div class="card">
          <p class="eyebrow" data-i18n="s1.eyebrow"></p>
          <h2 data-i18n="s1.title"></h2>
          <p data-i18n="s1.body"></p>
        </div>
      </section>
      <section class="left">
        <div class="card">
          <p class="eyebrow" data-i18n="s2.eyebrow"></p>
          <h2 data-i18n="s2.title"></h2>
          <p data-i18n="s2.body"></p>
        </div>
      </section>
      <section class="right">
        <div class="card">
          <p class="eyebrow" data-i18n="s3.eyebrow"></p>
          <h2 data-i18n="s3.title"></h2>
          <p data-i18n="s3.body"></p>
        </div>
      </section>
      <section class="left">
        <div class="card">
          <p class="eyebrow" data-i18n="s4.eyebrow"></p>
          <h2 data-i18n="s4.title"></h2>
          <p data-i18n="s4.body"></p>
        </div>
      </section>
      <section class="left">
        <div class="card">
          <p class="eyebrow" data-i18n="s5.eyebrow"></p>
          <h2 data-i18n="s5.title"></h2>
          <p data-i18n="s5.body"></p>
        </div>
      </section>
      <section class="right">
        <div class="card">
          <p class="eyebrow" data-i18n="s6.eyebrow"></p>
          <h2 data-i18n="s6.title"></h2>
          <p data-i18n="s6.body"></p>
        </div>
      </section>
      <section class="left">
        <div class="card">
          <p class="eyebrow" data-i18n="s7.eyebrow"></p>
          <h2 data-i18n="s7.title"></h2>
          <p data-i18n="s7.body"></p>
        </div>
      </section>
    </main>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
